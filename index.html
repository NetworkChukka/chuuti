<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Happy birthday</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500&family=Fraunces:ital,opsz,wght@1,9..144,500&display=swap">
<style>
:root{--night:#150b29;--glow:#ffc857;--rose:#e63e78;--day:#ffe6ee;--day2:#ffc9dc;--day-ink:#3a1233;--on-night:#ffe9c7;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--day:#3a0f2c;--day2:#5a1747;--day-ink:#ffe6ee}}
:root[data-theme="dark"]{--day:#3a0f2c;--day2:#5a1747;--day-ink:#ffe6ee}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;display:flex;flex-direction:column;background:radial-gradient(ellipse at 50% 30%,#2b1450,var(--night) 70%);color:var(--on-night);
  font:400 1.05rem/1.6 "DM Sans",system-ui,-apple-system,"Segoe UI",sans-serif;transition:color 1.2s ease;overflow-x:hidden}
body.day{color:var(--day-ink)}
#glow{position:fixed;inset:0;pointer-events:none;z-index:1;opacity:1;transition:opacity .8s;background:radial-gradient(circle at 50% 38%,rgba(255,200,87,.36),transparent 62%)}
#wash{position:fixed;inset:0;z-index:1;pointer-events:none;background:linear-gradient(120deg,var(--day),var(--day2),var(--day));background-size:300% 300%;
  animation:drift 14s ease-in-out infinite;clip-path:circle(0 at 50% 38%);transition:clip-path 1.5s cubic-bezier(.3,.7,.1,1)}
body.day #wash{clip-path:circle(150vmax at 50% 38%)}
@keyframes drift{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:3}
.shoot{position:fixed;top:10%;left:-15%;width:110px;height:2px;z-index:1;background:linear-gradient(90deg,transparent,#fff);opacity:0;animation:shoot 7s linear infinite}
.shoot+.shoot{top:30%;animation-delay:3.5s;animation-duration:9s}
@keyframes shoot{0%{transform:translate(0,0) rotate(23deg);opacity:0}3%{opacity:1}13%{transform:translate(125vw,55vh) rotate(23deg);opacity:0}100%{opacity:0}}
body.day .shoot{display:none}
.st{flex:1;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:28px 22px;gap:22px;position:relative;z-index:2}
.st.on{display:flex}
.st.fade{opacity:0;transition:opacity .6s}
h1,h2,.line{font-family:Fraunces,Georgia,"Times New Roman",serif;font-style:italic;font-weight:500;line-height:1.15;margin:0}
h1{font-size:clamp(2.5rem,10.5vw,4.6rem)}
h2{font-size:clamp(2rem,8vw,3rem)}
.wd{display:inline-block;white-space:nowrap}
.l .wd span{display:inline-block;animation:drop .9s cubic-bezier(.3,1.6,.5,1) var(--d) both,bob 3.4s ease-in-out calc(var(--d) + 1.2s) infinite}
@keyframes drop{from{opacity:0;transform:translateY(-.9em) scale(.6) rotate(-8deg)}to{opacity:1;transform:none}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-.12em)}}
.line{font-size:clamp(1.55rem,5.6vw,2.3rem);max-width:21em;min-height:4.6em;display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:0 .3em}
.w{display:inline-block;animation:wr .8s cubic-bezier(.2,.8,.2,1) var(--d) both}
@keyframes wr{from{opacity:0;transform:translateY(.7em) rotate(3deg);filter:blur(6px)}to{opacity:1;transform:none;filter:none}}
p{margin:0;max-width:30em}
.sig{font-family:Fraunces,Georgia,serif;font-style:italic;font-size:1.4rem;animation:wr 1s 1.6s both}
.btn{position:relative;overflow:hidden;font:500 1rem "DM Sans",system-ui,sans-serif;border:0;border-radius:999px;padding:14px 34px;min-height:48px;background:var(--rose);color:#fff;cursor:pointer;animation:breathe 2.4s ease-in-out infinite}
.btn::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.5) 50%,transparent 70%);transform:translateX(-120%);animation:shine 3s ease-in-out infinite}
@keyframes shine{to{transform:translateX(120%)}}
@keyframes breathe{0%,100%{box-shadow:0 0 0 0 rgba(230,62,120,.5)}50%{box-shadow:0 0 0 12px rgba(230,62,120,0)}}
.btn:active{transform:scale(.95)}
.btn:focus-visible,.flame:focus-visible{outline:3px solid var(--glow);outline-offset:3px}
.dots{display:flex;gap:8px;align-items:center}
.dots i{width:8px;height:8px;border-radius:8px;background:currentColor;opacity:.22;transition:all .4s}
.dots i.on{opacity:.8}.dots i.cur{opacity:1;width:24px}
#cake{width:min(80vw,320px);height:auto;overflow:visible;animation:float 5s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.flame{cursor:pointer;outline:none}
.flame .f{transform-box:fill-box;transform-origin:50% 100%;animation:fl .8s ease-in-out var(--o) infinite;transition:opacity .3s}
.flame.out .f{opacity:0;animation:none}
@keyframes fl{0%,100%{transform:scale(1,1) rotate(-3deg)}50%{transform:scale(.88,1.12) rotate(3deg)}}
.halo{transform-box:fill-box;transform-origin:center;animation:halo 1.6s ease-in-out var(--o) infinite}
@keyframes halo{0%,100%{transform:scale(.85);opacity:.55}50%{transform:scale(1.2);opacity:1}}
.ring{fill:none;stroke:#ffc857;stroke-width:1.5;transform-box:fill-box;transform-origin:center;animation:ring 1.9s ease-out var(--o) infinite}
@keyframes ring{from{transform:scale(.6);opacity:.9}to{transform:scale(2.2);opacity:0}}
.tapped .ring,.flame.out .ring,.flame.out .halo{display:none}
#hint{min-height:3.2em;max-width:20em;animation:wr 1.2s 1.4s both}
.heart{width:76px;height:76px;filter:drop-shadow(0 0 14px rgba(230,62,120,.6));animation:beat 1s ease-in-out infinite}
@keyframes beat{0%,100%{transform:scale(1)}15%{transform:scale(1.2)}30%{transform:scale(1)}45%{transform:scale(1.14)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

:root{--card:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--card:#4d1b3f}}
:root[data-theme="dark"]{--card:#4d1b3f}
html{scroll-behavior:smooth}
#main{display:none;flex:1;width:100%}#main.on{display:block}
.ch{min-height:100vh;min-height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:64px 22px;gap:22px;position:relative;z-index:2}
.ch>*{opacity:0;translate:0 26px;transition:opacity .9s ease,translate .9s ease}
.ch>:nth-child(2){transition-delay:.15s}.ch>:nth-child(3){transition-delay:.3s}
.ch.in>*{opacity:1;translate:0 0}
.ch .w,.ch .l .wd span{animation-play-state:paused}
.ch.in .w,.ch.in .l .wd span{animation-play-state:running}
.ch .sig{animation:none}
#lm{font-family:Fraunces,Georgia,serif;font-style:italic;font-size:1.7rem;animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{opacity:.35}}
.cue{animation:cue 1.6s ease-in-out infinite}
@keyframes cue{0%,100%{transform:translateY(0);opacity:.4}50%{transform:translateY(10px);opacity:1}}
.btn.alt{background:transparent;border:1.5px solid var(--glow);color:var(--on-night);animation:none}.btn.alt::after{display:none}
.rail{align-self:stretch;margin:0 -22px;display:flex;gap:16px;overflow-x:auto;scroll-snap-type:x mandatory;scroll-padding:0 22px;padding:10px 22px 26px;scrollbar-width:none}
.rail::-webkit-scrollbar{display:none}
.card{flex:0 0 min(78vw,280px);scroll-snap-align:center;min-height:220px;border-radius:22px;padding:24px;display:flex;flex-direction:column;justify-content:center;background:var(--card);color:var(--day-ink);box-shadow:0 12px 34px rgba(230,62,120,.22);font-family:Fraunces,Georgia,serif;font-style:italic;font-size:1.35rem;line-height:1.35;rotate:-1.5deg}
.card:nth-child(even){rotate:1.5deg}
.card b{display:block;font-size:2.2rem;font-style:normal;margin-bottom:8px}
.gift{position:relative;width:150px;height:150px;border:0;background:none;cursor:pointer;font-size:0;animation:shake 2.4s ease-in-out infinite}
.gift .box{position:absolute;left:10px;right:10px;bottom:0;height:92px;border-radius:8px;background:var(--rose);box-shadow:inset 0 -12px 0 rgba(0,0,0,.14)}
.gift .box::before,.gift .lid::before{content:"";position:absolute;left:50%;width:22px;margin-left:-11px;top:0;bottom:0;background:#ffc857}
.gift .lid{position:absolute;left:0;right:0;top:34px;height:36px;border-radius:8px;background:#ff5d8f;z-index:2;transition:translate .8s cubic-bezier(.3,1.5,.5,1),rotate .8s,opacity .7s .2s}
.gift .lid::after{content:"🎀";position:absolute;left:50%;top:-26px;translate:-50% 0;font-size:34px}
.gift.open{animation:none}.gift.open .lid{translate:46px -100px;rotate:24deg;opacity:0}
@keyframes shake{0%,58%,100%{transform:rotate(0)}64%{transform:rotate(-5deg)}72%{transform:rotate(5deg)}80%{transform:rotate(-4deg)}90%{transform:rotate(3deg)}}
.letter{max-width:30em;min-height:15em;text-align:left;white-space:pre-wrap;font-family:Fraunces,Georgia,serif;font-style:italic;font-size:1.25rem;line-height:1.6;background:var(--card);color:var(--day-ink);padding:24px;border-radius:14px;border-left:4px solid var(--rose);box-shadow:0 12px 34px rgba(230,62,120,.18);visibility:hidden}
.letter.on{visibility:visible}
.secs{display:flex;gap:18px}
.sec{border:0;background:none;font-size:1.7rem;opacity:.55;cursor:pointer;min-width:44px;min-height:44px;animation:bob 3s ease-in-out infinite}
.sec+.sec{animation-delay:-1.5s}
#mus{display:none;position:fixed;right:14px;bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:6;width:46px;height:46px;border-radius:50%;border:0;background:var(--rose);color:#fff;font-size:1.2rem;cursor:pointer}
#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));translate:-50% 16px;max-width:82vw;background:var(--day-ink);color:var(--day);padding:12px 18px;border-radius:14px;opacity:0;transition:opacity .5s,translate .5s;z-index:6;pointer-events:none;text-align:center}
#toast.on{opacity:1;translate:-50% 0}
</style>
</head>
<body>
<div id="glow"></div>
<div id="wash"></div>
<i class="shoot"></i><i class="shoot"></i>
<canvas id="fx"></canvas>

<section class="st on" id="load"><p id="lm"></p></section>

<section class="st" id="night">
  <h2 id="t0"></h2>
  <svg id="cake" viewBox="0 0 240 230" role="img" aria-label="A birthday cake with three candles">

<circle cx="36" cy="141.6" r="6.5" fill="url(#pearl)"/><circle cx="52" cy="144.5" r="6.5" fill="url(#pearl)"/><circle cx="68" cy="146.2" r="6.5" fill="url(#pearl)"/><circle cx="84" cy="147.2" r="6.5" fill="url(#pearl)"/><circle cx="100" cy="147.7" r="6.5" fill="url(#pearl)"/><circle cx="120" cy="148" r="6.5" fill="url(#pearl)"/><circle cx="140" cy="147.7" r="6.5" fill="url(#pearl)"/><circle cx="156" cy="147.2" r="6.5" fill="url(#pearl)"/><circle cx="172" cy="146.2" r="6.5" fill="url(#pearl)"/><circle cx="188" cy="144.5" r="6.5" fill="url(#pearl)"/><circle cx="204" cy="141.6" r="6.5" fill="url(#pearl)"/><circle cx="38" cy="201" r="5.5" fill="url(#pearl)"/><circle cx="51" cy="201" r="5.5" fill="url(#pearl)"/><circle cx="64" cy="201" r="5.5" fill="url(#pearl)"/><circle cx="77" cy="201" r="5.5" fill="url(#pearl)"/><circle cx="90" cy="201" r="5.5" fill="url(#pearl)"/><circle cx="103" cy="201" r="5.5" fill="url(#pearl)"/><circle cx="116" cy="201" r="5.5" fill="url(#pearl)"/><circle cx="129" cy="201" r="5.5" fill="url(#pearl)"/><circle cx="142" cy="201" r="5.5" fill="url(#pearl)"/><circle cx="155" cy="201" r="5.5" fill="url(#pearl)"/><circle cx="168" cy="201" r="5.5" fill="url(#pearl)"/><circle cx="181" cy="201" r="5.5" fill="url(#pearl)"/><circle cx="194" cy="201" r="5.5" fill="url(#pearl)"/><circle cx="207" cy="201" r="5.5" fill="url(#pearl)"/>

  <p id="hint">Close your eyes and make a wish. Then tap each candle to blow it out.</p>
  <button class="btn alt" id="mic">Or blow with your voice</button>
</section>

<main id="main">
<section class="ch" id="intro"><h1 id="t1"></h1><p>I made you a few things. Scroll down slowly and take your time.</p>
<svg class="cue" viewBox="0 0 24 24" width="30" height="30" aria-hidden="true"><path d="M5 9l7 7 7-7" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></section>
<div id="story"></div>
<section class="ch" id="reasons"><h2>Reasons you’re amazing</h2><div class="rail" id="rail"></div><p>Swipe to see them all.</p></section>
<section class="ch" id="gift"><h2>I got you something</h2><button class="gift" id="gift-btn" aria-label="Open your gift"><span class="box"></span><span class="lid"></span></button><div class="letter" id="letter"></div></section>
<section class="ch" id="end">
  <svg class="heart" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-7-4.4-9.3-9C1 8.5 3 5 6.5 5c2 0 3.5 1.1 5.5 3 2-1.9 3.5-3 5.5-3C21 5 23 8.5 21.3 12 19 16.6 12 21 12 21z" fill="#e63e78"/></svg>
  <h1 id="t2"></h1><p id="finale"></p>
  <div class="sig">With all my love, <span id="from"></span></div>
  <button class="btn" id="again">Celebrate again</button>
  <div class="secs"><button class="sec" aria-label="A secret note">🌙</button><button class="sec" aria-label="Another secret note">💗</button></div>
</section>
</main>
<button id="mus" aria-label="Turn music on or off">🔊</button>
<div id="toast" role="status"></div>

<script>
/* Edit these to personalise the page */
const C={
  name:"Chuuti",
  from:"",
  lines:[
    "Another year of you, and the world is a little brighter for it.",
    "You make ordinary days feel like something worth remembering.",
    "I love how easy it is to be myself when I’m with you.",
    "I hope this year gives you everything you’ve been quietly wishing for."
  ],
  reasons:[
    "Your smile makes my worst days feel lighter.",
    "You listen like what I say really matters.",
    "You believe in me, even when I doubt myself.",
    "You make ordinary moments feel special.",
    "Being with you feels like home.",
    "You make me want to be a better person."
  ],
  letter:"Chuuti,\n\nHappy birthday. I hope today feels as special as you make every day for me.\n\nThank you for your smile, your patience, and for being exactly who you are. I’m grateful for you more than I can say.\n\nForever yours,\n"+"",
  finale:"I’m so lucky to get to celebrate you today. Here’s to a year full of laughing together, and every birthday after it.",
  secrets:["Look up tonight. Wherever you are, I’m under the same moon, thinking of you.","Psst. I’ll love you a little more tomorrow than I do today."]
};

const $=s=>document.querySelector(s),all=s=>[...document.querySelectorAll(s)];
const still=matchMedia("(prefers-reduced-motion: reduce)").matches;
document.title="Happy birthday, "+C.name;
$("#from").textContent=C.from;$("#finale").textContent=C.finale;
function split(el,txt){let n=0;el.className="l";el.innerHTML=txt.split(" ").map(w=>'<span class="wd">'+[...w].map(c=>'<span style="--d:'+(n++*45)+'ms">'+c+"</span>").join("")+"</span>").join(" ")}
split($("#t0"),"Make a wish");split($("#t1"),"Happy birthday, "+C.name);split($("#t2"),"Happy birthday, "+C.name);
const show=id=>all(".st").forEach(s=>s.classList.toggle("on",s.id===id));

/* canvas: stars, confetti, hearts, fireworks, balloons, smoke */
const cv=$("#fx"),cx=cv.getContext("2d"),cols=["#e63e78","#ffc857","#8ecae6","#b5179e","#ff8fb1","#7bd88f"];
let W=0,H=0,P=[],S=[],day=false,sa=1;
function size(){const d=devicePixelRatio||1;W=innerWidth;H=innerHeight;cv.width=W*d;cv.height=H*d;cx.setTransform(d,0,0,d,0,0);
  S=Array.from({length:80},()=>({x:Math.random()*W,y:Math.random()*H,r:.5+Math.random()*1.4,p:Math.random()*6}))}
size();addEventListener("resize",size);
const R=(a,b)=>a+Math.random()*(b-a);
function burst(x,y,n){for(let i=0;i<n;i++){const a=R(0,6.28),s=R(4,11);P.push({k:0,x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-5,w:R(6,12),h:R(4,9),c:cols[i%6],r:R(0,6),vr:R(-.2,.2),l:1})}}
function cannon(){[0,1].forEach(side=>{for(let i=0;i<80;i++){const a=-R(35,80)*Math.PI/180,s=R(9,17);
  P.push({k:0,x:side?W:0,y:H,vx:Math.cos(a)*s*(side?-1:1),vy:Math.sin(a)*s,w:R(6,12),h:R(4,9),c:cols[i%6],r:R(0,6),vr:R(-.2,.2),l:1})}})}
function rain(n){for(let i=0;i<n;i++)setTimeout(()=>P.push({k:0,x:R(0,W),y:-20,vx:R(-1,1),vy:R(1,3),w:7,h:5,c:cols[i%6],r:0,vr:.1,l:1}),i*50)}
function heart(x,y){P.push({k:1,e:["💗","🦋","✨","💖"][Math.random()*4|0],x,y,vy:-R(.7,1.8),s:R(14,30),o:R(0,6),l:1})}
function fw(x,y,n,sp){const c=cols[Math.random()*6|0];for(let i=0;i<n;i++){const a=i/n*6.283,s=R(.6,1)*sp;P.push({k:2,x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,c,l:1})}}
function rocket(){P.push({k:5,x:R(W*.15,W*.85),y:H,vy:-R(9,12),ty:H*R(.15,.45),l:1})}
function balloon(){P.push({k:3,x:R(30,W-30),y:H+80,vy:-R(.8,1.8),s:R(24,40),c:cols[Math.random()*6|0],o:R(0,6),l:1})}
function smoke(x,y){for(let i=0;i<7;i++)P.push({k:4,x:x+R(-4,4),y:y-i*3,r:R(3,7),o:R(0,6),l:1})}
function loop(){cx.clearRect(0,0,W,H);
  sa+=((day?0:1)-sa)*.04;
  if(sa>.02){const t=performance.now()/700;cx.fillStyle="#fff";for(const s of S){cx.globalAlpha=sa*(.25+.75*Math.abs(Math.sin(t+s.p)));cx.beginPath();cx.arc(s.x,s.y,s.r,0,6.283);cx.fill()}}
  for(const p of P){
    if(p.k===0){p.vy+=.18;p.vx*=.99;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;p.l-=.005;cx.globalAlpha=Math.max(p.l,0);cx.save();cx.translate(p.x,p.y);cx.rotate(p.r);cx.fillStyle=p.c;cx.fillRect(-p.w/2,-p.h/2,p.w,p.h);cx.restore()}
    else if(p.k===1){p.y+=p.vy;p.x+=Math.sin((p.y+p.o)/30)*.5;p.l-=.0016;cx.globalAlpha=Math.max(p.l,0)*.8;cx.font=p.s+"px serif";cx.fillText(p.e||"💗",p.x,p.y)}
    else if(p.k===2){p.x+=p.vx;p.y+=p.vy;p.vx*=.97;p.vy=p.vy*.97+.04;p.l-=.014;cx.globalAlpha=Math.max(p.l,0);cx.strokeStyle=p.c;cx.lineWidth=2.2;cx.beginPath();cx.moveTo(p.x-p.vx*1.6,p.y-p.vy*1.6);cx.lineTo(p.x,p.y);cx.stroke()}
    else if(p.k===3){p.y+=p.vy;p.x+=Math.sin((p.y+p.o)/40)*.6;cx.globalAlpha=.92;cx.fillStyle=p.c;cx.beginPath();cx.ellipse(p.x,p.y,p.s*.8,p.s,0,0,6.283);cx.fill();
      cx.fillStyle="rgba(255,255,255,.4)";cx.beginPath();cx.ellipse(p.x-p.s*.3,p.y-p.s*.35,p.s*.14,p.s*.28,.5,0,6.283);cx.fill();
      cx.strokeStyle="rgba(130,120,150,.55)";cx.lineWidth=1;cx.beginPath();cx.moveTo(p.x,p.y+p.s);cx.quadraticCurveTo(p.x+9,p.y+p.s+22,p.x-4,p.y+p.s+46);cx.stroke()}
    else if(p.k===4){p.y-=.7;p.x+=Math.sin((p.y+p.o)/12)*.5;p.r+=.5;p.l-=.012;cx.globalAlpha=Math.max(p.l,0)*.35;cx.fillStyle="#cfc9e0";cx.beginPath();cx.arc(p.x,p.y,p.r,0,6.283);cx.fill()}
    else{p.y+=p.vy;p.vy*=.985;cx.globalAlpha=1;cx.fillStyle="#fff";cx.beginPath();cx.arc(p.x,p.y,2,0,6.283);cx.fill();
      if(p.y<=p.ty||p.vy>-2){p.l=0;fw(p.x,p.y,56,R(2.6,4))}}
  }
  cx.globalAlpha=1;P=P.filter(p=>p.l>0&&p.y<H+110&&p.y>-160);requestAnimationFrame(loop)}
if(!still){loop();
  setInterval(()=>{if(day){heart(R(0,W),H+20)}},800);
  setInterval(()=>{if(day&&P.filter(p=>p.k===3).length<9)balloon()},1300);
  setInterval(()=>{if($("#end").classList.contains("in"))rocket()},1000);
  addEventListener("pointerdown",e=>{if(day){fw(e.clientX,e.clientY,14,2.2);for(let i=0;i<3;i++)heart(e.clientX+R(-20,20),e.clientY)}})}

/* loader */
const LM=["Getting things ready…","Lighting the candles…","Almost there…"];let li=0;$("#lm").textContent=LM[0];
const lt=setInterval(()=>{li++;if(li<LM.length)$("#lm").textContent=LM[li];else{clearInterval(lt);show("night");$("#mus").style.display="block"}},800);

/* music box (synthesised, no files) */
let ac=null,mOn=false,mT,started=0;
const NF={G4:392,A4:440,B4:493.88,C5:523.25,D5:587.33,E5:659.25,F5:698.46,G5:783.99};
const TUNE=[["G4",.75],["G4",.25],["A4",1],["G4",1],["C5",1],["B4",2],["G4",.75],["G4",.25],["A4",1],["G4",1],["D5",1],["C5",2],["G4",.75],["G4",.25],["G5",1],["E5",1],["C5",1],["B4",1],["A4",1],["F5",.75],["F5",.25],["E5",1],["C5",1],["D5",1],["C5",2]];
function note(f,t,d){const o=ac.createOscillator(),g=ac.createGain();o.type="triangle";o.frequency.value=f;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.07,t+.01);g.gain.exponentialRampToValueAtTime(.0008,t+d*1.7);o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+d*1.7+.05)}
function play(){if(!mOn||!ac)return;let t=ac.currentTime+.1;for(const[n,d]of TUNE){note(NF[n],t,d*.55);note(NF[n]*2,t,d*.3);t+=d*.55}mT=setTimeout(play,(t-ac.currentTime+2.5)*1000)}
function music(on){mOn=on;$("#mus").textContent=on?"🔊":"🔇";clearTimeout(mT);if(ac){ac.close();ac=null}if(on){ac=new(window.AudioContext||window.webkitAudioContext)();play()}}
addEventListener("pointerdown",e=>{if(!started&&!e.target.closest("#mus,#mic")){started=1;music(true)}});
$("#mus").onclick=()=>{started=1;music(!mOn)};

/* candles -> lights on */
let lit=3;const glow=$("#glow");
function lights(){setTimeout(()=>{day=true;document.body.classList.add("day");glow.style.opacity=0;$("#night").classList.add("fade");
  if(!still){cannon();burst(W/2,H*.4,120);for(let i=0;i<6;i++)setTimeout(balloon,i*220)}
  setTimeout(()=>{$("#night").classList.remove("on");$("#main").classList.add("on");scrollTo(0,0)},1500)},500)}
all(".flame").forEach(f=>{
  const out=()=>{if(f.classList.contains("out"))return;f.classList.add("out");document.body.classList.add("tapped");lit--;glow.style.opacity=lit/3;
    const b=f.querySelector(".f").getBoundingClientRect();if(!still)smoke(b.left+b.width/2,b.top);
    $("#hint").style.animation="none";$("#hint").textContent=lit?"Keep going. "+lit+(lit===1?" candle left.":" candles left."):"Wish made.";
    if(!lit)lights()};
  f.onclick=out;f.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();out()}};
});
$("#mic").onclick=async()=>{
  try{const st=await navigator.mediaDevices.getUserMedia({audio:true}),a=new(window.AudioContext||window.webkitAudioContext)(),an=a.createAnalyser();
    an.fftSize=512;a.createMediaStreamSource(st).connect(an);const d=new Uint8Array(an.fftSize);let hold=0;
    if(mOn)music(false);$("#hint").style.animation="none";$("#hint").textContent="Listening. Take a deep breath and blow.";$("#mic").style.display="none";
    const tick=()=>{if(!lit){st.getTracks().forEach(t=>t.stop());a.close();return}
      an.getByteTimeDomainData(d);let m=0;for(const v of d)m=Math.max(m,Math.abs(v-128));hold=m>70?hold+1:0;
      if(hold>12){hold=0;const f=all(".flame:not(.out)")[0];if(f)f.dispatchEvent(new Event("click"))}requestAnimationFrame(tick)};tick()}
  catch(e){$("#hint").style.animation="none";$("#hint").textContent="The mic isn’t available here. Tap each candle instead."}};

/* chapters */
$("#story").innerHTML=C.lines.map(l=>'<section class="ch"><div class="line">'+l.split(" ").map((w,k)=>'<span class="w" style="--d:'+k*70+'ms">'+w+"</span>").join(" ")+"</div></section>").join("");
const ICON=["💗","✨","🌙","🦋","🏡","🌹"];
$("#rail").innerHTML=C.reasons.map((r,k)=>'<div class="card"><b>'+ICON[k%6]+"</b>"+r+"</div>").join("");
const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting)e.target.classList.add("in");else if(e.target.id==="end")e.target.classList.remove("in")}),{threshold:.35});
all(".ch").forEach(c=>io.observe(c));

/* gift, letter, secrets */
$("#gift-btn").onclick=function(){if(this.classList.contains("open"))return;this.classList.add("open");
  if(!still){burst(W/2,H*.5,90);for(let k=0;k<8;k++)heart(W*R(.3,.7),H*.6)}
  const L=$("#letter");L.classList.add("on");let n=0;(function t(){L.textContent=C.letter.slice(0,++n);if(n<C.letter.length)setTimeout(t,32)})()};
const T=$("#toast");let tt;
all(".sec").forEach((b,k)=>b.onclick=()=>{T.textContent=C.secrets[k];T.classList.add("on");clearTimeout(tt);tt=setTimeout(()=>T.classList.remove("on"),4500);if(!still)heart(W/2,H*.7)});
$("#again").onclick=()=>{if(!still){cannon();rain(60);for(let k=0;k<4;k++)setTimeout(rocket,k*250)}};
</script>
</body>
</html>
